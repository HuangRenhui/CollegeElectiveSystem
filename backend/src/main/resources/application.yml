server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    threads:
      max: 500
      min-spare: 50
    max-connections: 10000
    accept-count: 1000

spring:
  application:
    name: college-elective-system
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.college.elective.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 业务自定义配置
elective:
  # 数据库表结构自动初始化：开发环境启动时自动创建缺失的数据表
  # 仅在不含 prod 的环境生效；已存在的表不会被修改或删除
  database:
    auto-init: true
  jwt:
    # 生产环境请通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:CollegeElectiveSystemSecretKeyForJwtTokenMustBeLongEnough2026}
    # token 有效期（秒），默认 7200 = 2 小时
    expire-seconds: 7200
    # token 续期阈值（秒），剩余时间小于该值时自动续期
    refresh-threshold-seconds: 600
    header: Authorization
    prefix: "Bearer "
  selection:
    # 单个学生可选的学分上限（用于选课校验）
    max-credit: 30
    # 单次选课请求的分布式锁等待时间（毫秒）
    lock-wait-millis: 300
    # 是否开启选课开关（管理员可动态关闭）
    enabled: true
    # ---------- 选课排队（高峰期削峰，默认关闭） ----------
    # 是否启用排队。关闭时选课链路与原先完全一致，无任何额外开销
    queue-enabled: false
    # 每秒放行名额，即高峰期最大并发准入速率。
    # 建议不超过数据库连接池容量的 1/2，避免放行速度本身打满连接池
    queue-per-second: 50
    # 单课程最大排队人数，超出直接拒绝，防止无限堆积
    queue-max-size: 5000
    # 排队令牌有效期（秒），超时未完成选课需重新取号
    queue-token-ttl-seconds: 120
  cors:
    allowed-origins:
      - http://localhost:5174
      - http://localhost:80
      - http://localhost

# 微信小程序配置
# ⚠️ app-secret 必须通过环境变量 WX_APP_SECRET 注入，切勿提交到仓库
#    未配置 app-id / app-secret 时，微信登录与订阅消息功能自动禁用，
#    小程序端会隐藏对应入口，不影响其余功能
wx:
  miniapp:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    # 订阅消息模板ID，在微信公众平台申请后填入（需经环境变量或配置中心下发）
    review-open-template-id: ${WX_TPL_REVIEW_OPEN:}
    grade-publish-template-id: ${WX_TPL_GRADE_PUBLISH:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: true
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
  production: false

logging:
  level:
    root: info
    com.college.elective: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
