server:
  port: 8080
  servlet:
    context-path: /api
    encoding:
      charset: UTF-8
      force: true
  tomcat:
    threads:
      max: 500
      min-spare: 50
    max-connections: 10000
    accept-count: 1000

spring:
  application:
    name: college-elective-system
  profiles:
    active: dev
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
      fail-on-empty-beans: false
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 50MB

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.college.elective.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
  global-config:
    banner: false
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  # ---------- 邮件 SMTP ----------
  # 注意：本项目不使用 Spring Boot 标准的 spring.mail.* 自动装配，
  # 所有邮件参数统一收在 elective.mail.* 下，由 MailConfig 显式创建
  # JavaMailSenderImpl。参见 elective.mail 小节的说明。

# 业务自定义配置
elective:
  # 数据库表结构自动初始化：开发环境启动时自动创建缺失的数据表
  # 仅在不含 prod 的环境生效；已存在的表不会被修改或删除
  database:
    auto-init: true
  jwt:
    # 生产环境请通过环境变量 JWT_SECRET 覆盖
    secret: ${JWT_SECRET:CollegeElectiveSystemSecretKeyForJwtTokenMustBeLongEnough2026}
    # token 有效期（秒），默认 7200 = 2 小时
    expire-seconds: 7200
    # token 续期阈值（秒），剩余时间小于该值时自动续期
    refresh-threshold-seconds: 600
    header: Authorization
    prefix: "Bearer "
  selection:
    # 单个学生可选的学分上限（用于选课校验）
    max-credit: 30
    # 单次选课请求的分布式锁等待时间（毫秒）
    lock-wait-millis: 300
    # 是否开启选课开关（管理员可动态关闭）
    enabled: true
    # ---------- 选课排队（高峰期削峰，默认关闭） ----------
    # 是否启用排队。关闭时选课链路与原先完全一致，无任何额外开销
    queue-enabled: false
    # 每秒放行名额，即高峰期最大并发准入速率。
    # 建议不超过数据库连接池容量的 1/2，避免放行速度本身打满连接池
    queue-per-second: 50
    # 单课程最大排队人数，超出直接拒绝，防止无限堆积
    queue-max-size: 5000
    # 排队令牌有效期（秒），超时未完成选课需重新取号
    queue-token-ttl-seconds: 120
  # ---------- 邮件通知（选课成功 / 成绩发布）----------
  # 全部参数集中于此，由 MailConfig 显式创建 JavaMailSenderImpl。
  # 未配置 host 时不会注册 JavaMailSender，邮件通知静默降级，不影响启动与主流程。
  mail:
    # ⚠️ 变量前缀必须是 ELECTIVE_MAIL_*，不能写成 MAIL_*。
    #    因为 Spring Boot 的「宽松绑定」会同时把环境变量 ELECTIVE_MAIL_HOST
    #    直接绑定到 elective.mail.host 属性；若此处占位符再读一个不同名的
    #    MAIL_HOST，两条路径会互相干扰：占位符取到空值走默认、
    #    而宽松绑定又把真实值写回属性，表现为「部分字段生效、部分不生效」，
    #    极难排查。统一用同一套变量名可彻底避免。
    enabled: ${ELECTIVE_MAIL_ENABLED:false}
    host: ${ELECTIVE_MAIL_HOST:}
    # 465→SMTPS(隐式 SSL，保持 ssl-enable=true)
    # 587→STARTTLS(改 ssl-enable=false + starttls-enable=true)
    port: ${ELECTIVE_MAIL_PORT:465}
    username: ${ELECTIVE_MAIL_USERNAME:}
    password: ${ELECTIVE_MAIL_PASSWORD:}
    ssl-enable: ${ELECTIVE_MAIL_SSL:true}
    starttls-enable: ${ELECTIVE_MAIL_STARTTLS:false}
    # 发件人。建议写成 "选修课系统 <noreply@xx.edu.cn>"，
    # 部分 SMTP 服务要求发件人与认证账号一致，否则会被拒
    from: ${ELECTIVE_MAIL_FROM:}
    subject-prefix: 【选修课系统】
    # 三个超时都必须设置，否则 SMTP 无响应时发送线程会被长期占用
    connection-timeout: 5000
    timeout: 5000
    write-timeout: 5000
  cors:
    allowed-origins:
      - http://localhost:5174
      - http://localhost:80
      - http://localhost

# 微信小程序配置
# ⚠️ 凭证一律通过环境变量注入，切勿硬编码到本文件！
#    app-secret 等同于小程序钥匙，泄露后他人可伪造用户身份调用微信接口。
#    未配置 app-id / app-secret 时，微信登录与订阅消息功能自动禁用，
#    小程序端会隐藏对应入口，不影响其余功能。
#
#    本地调试请在 IDEA 的 Run Configuration → Environment variables 中填写：
#      WX_APP_ID=wx...
#      WX_APP_SECRET=...
#      WX_TPL_REVIEW_OPEN=...
#      WX_TPL_GRADE_PUBLISH=...
#    或在命令行启动时前置设置这些环境变量。
wx:
  miniapp:
    app-id: ${WX_APP_ID:}
    app-secret: ${WX_APP_SECRET:}
    # 订阅消息模板ID，在微信公众平台 · 小程序后台「功能 → 订阅消息」申请后填入
    review-open-template-id: ${WX_TPL_REVIEW_OPEN:}
    grade-publish-template-id: ${WX_TPL_GRADE_PUBLISH:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
    enabled: true
  default-flat-param-object: true

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表
  production: false

logging:
  level:
    root: info
    com.college.elective: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
