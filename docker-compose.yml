services:
  mysql:
    image: mysql:8.0
    container_name: elective-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: college_elective
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
      - --default-time-zone=+08:00
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # 首次启动自动执行建表与初始化数据脚本
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./backend/src/main/resources/db/data.sql:/docker-entrypoint-initdb.d/02-data.sql:ro
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot123456" ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.2-alpine
    container_name: elective-redis
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "redis123456" ]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "redis123456", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: elective-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/college_elective?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root123456
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: redis123456
      JWT_SECRET: CollegeElectiveSystemSecretKeyForJwtTokenMustBeLongEnough2026
    ports:
      - "8080:8080"
    # 与 Dockerfile 中的探活保持一致：/api/v3/api-docs 在 prod 已关闭，不能用它探活
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8080/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    # 给优雅停机留出时间：Spring 需要把进行中的选课事务处理完再退出
    stop_grace_period: 40s
    # 单实例默认资源上限，避免一条慢查询把宿主机拖垮（按实际机器规格调整）。
    # 取值依据：JVM -Xmx1024m + 元空间/直接内存/线程栈，留出约 700M 余量；
    # 若把上限压到接近 Xmx，容器会在内存回收时被 OOMKilled 而不是抛 Java OOM
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1792M

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: elective-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "80:80"
    healthcheck:
      test: [ "CMD", "wget", "-q", "--spider", "http://localhost/" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

volumes:
  mysql-data:
  redis-data:
