# 该文件被挂载为 /etc/nginx/conf.d/default.conf，由 nginx.conf 的 http 块 include，
# 因此此处的 limit_req_zone 属于 http 上下文，声明是合法的。

# 接口限流：单 IP 每秒 20 个请求、允许 40 个突发。
# 没有它时，脚本可以无成本地把选课/登录接口打进后端；
# 应用层虽有排队与登录锁定，但那些都要先消耗一个 Tomcat 线程。
# 注意：若前置了 CDN / 负载均衡，需配合 ngx_http_realip_module 还原真实客户端 IP，
# 否则所有请求的来源 IP 都是 LB 地址，限流会退化为「全局限流」。
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=assets_limit:10m rate=200r/s;

server {
    listen       80;
    server_name  localhost;

    charset utf-8;
    # 与后端 spring.servlet.multipart.max-request-size (50MB) 保持一致，
    # 否则会出现「Nginx 放行、后端越界」的 500 而不是明确的 413
    client_max_body_size 50m;
    client_body_buffer_size 128k;

    # 不暴露版本号，减少指纹信息
    server_tokens off;

    # 限流触发时返回 429（默认 503 会被前端当成「服务不可用」）
    limit_req_status 429;
    limit_conn_status 429;

    # 基础安全响应头。放在 server 级，location 内若出现 add_header 需要重复声明
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # 若本机直接对公网提供 HTTPS，可再补：
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_vary on;

    root /usr/share/nginx/html;
    index index.html;

    # 前端路由（history 模式）回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot)$ {
        limit_req zone=assets_limit burst=400 nodelay;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        # location 内一旦有 add_header 就不再生效 server 级的安全头，需重复声明
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    # 后端接口转发
    location /api/ {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        # 报表导出等长耗时接口需要更长的读超时，但不能无限等待，
        # 否则后端 hang 住时会一直占用 nginx 连接
        proxy_send_timeout 60s;
        proxy_read_timeout 120s;

        # 对幂等请求在连接错误时重试一次，避免后端重启瞬间的 502 直接抛给用户
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
