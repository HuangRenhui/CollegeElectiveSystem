<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="高校选修课管理系统 - 提供课程选修、课表查询、成绩管理等教务服务" />
    <meta name="keywords" content="选修课,选课系统,课表查询,成绩查询,教务管理" />
    <title>高校选修课管理系统</title>
  </head>
  <body>
    <div id="app">
      <div class="app-loading">
        <div class="app-loading__spinner"></div>
        <p>系统加载中，请稍候…</p>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <style>
      html,
      body,
      #app {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .app-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        font-family: system-ui, -apple-system, 'Microsoft YaHei', sans-serif;
        color: #6b7280;
      }
      .app-loading__spinner {
        width: 42px;
        height: 42px;
        border: 3px solid #e5e7eb;
        border-top-color: #409eff;
        border-radius: 50%;
        animation: app-loading-rotate 0.9s linear infinite;
      }
      @keyframes app-loading-rotate {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </body>
</html>
